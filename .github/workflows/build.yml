name: Build Riochi (APK + EXE)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ Android (Capacitor)
  android:
    name: APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1" # inutile ici, ça évite de télécharger Electron
      # Secrets facultatifs : s'ils sont définis, l'APK est signé avec TA clé (voir README).
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      - name: Lire la version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Installer les dépendances
        run: npm ci

      - name: Copier www/ dans le projet Android
        run: npx cap sync android

      - name: APK debug (aucune clé de signature configurée)
        if: env.KEYSTORE_B64 == ''
        working-directory: android
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PriochiVersionCode="$GITHUB_RUN_NUMBER" -PriochiVersionName="$VERSION"
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk "../out/Riochi-$VERSION-debug.apk"

      - name: APK release signé (clé fournie par les secrets)
        if: env.KEYSTORE_B64 != ''
        working-directory: android
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease -PriochiVersionCode="$GITHUB_RUN_NUMBER" -PriochiVersionName="$VERSION"

          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/riochi.jks"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          export KS_PASS="$KEYSTORE_PASSWORD"
          export KEY_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"

          mkdir -p ../out
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/riochi.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out "../out/Riochi-$VERSION.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose "../out/Riochi-$VERSION.apk"
          rm -f "$RUNNER_TEMP/riochi.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: riochi-apk
          path: out/*.apk
          if-no-files-found: error

  # ------------------------------------------------------------------ Windows (Electron)
  windows:
    name: EXE Windows
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l'installateur et la version portable
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # pas de certificat de signature de code

      - uses: actions/upload-artifact@v7
        with:
          name: riochi-windows
          path: dist-electron/*.exe
          if-no-files-found: error

  # ------------------------------------------------------------------ Release (tag vX.Y.Z)
  release:
    name: Publier la release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.apk
            dist/*.exe
          generate_release_notes: true
